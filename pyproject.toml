[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmclient"
version = "0.1.0"
description = "A vendor-agnostic LLM client with configurable models and expense tracking"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
anthropic = ["anthropic"]
google = ["google-genai"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmclient"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "N",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
